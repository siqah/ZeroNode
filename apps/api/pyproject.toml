[project]
name = "zeronode-api"
version = "0.1.0"
description = "ZeroNode FastAPI control plane and LangGraph agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "langgraph>=0.2.45",
  "langchain-core>=0.3.0",
  "langchain-ollama>=0.2.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "psycopg[binary,pool]>=3.2.0",
  "neo4j>=5.26.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pyjwt>=2.9.0",
  "email-validator>=2.2.0",
  "argon2-cffi>=23.1.0",
  "cryptography>=43.0.0",
  "prometheus-client>=0.21.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
vllm = [
  "langchain-openai>=0.2.0",
]
devices = [
  "netmiko>=4.4.0",
]
observability = [
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-exporter-otlp-proto-http>=1.28.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies in argument defaults by design.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "app.auth.deps.require_role",
]

[tool.ruff.lint.per-file-ignores]
# Prompt and fixture text is verbatim; wrapping it would change what the model sees.
"app/graph/prompts.py" = ["E501"]
"app/graph/scripted.py" = ["E501"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires real Postgres and/or Neo4j service containers",
    "device: requires the fake-asa SSH device emulator",
]
# Report skip reasons. The device tests skip themselves when the emulator is
# not running or the devices extra is missing, and a silent skip reads as a pass.
addopts = "-rs"
