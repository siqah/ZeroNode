name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install API package from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .

      - name: Verify requirements.lock is current
        run: |
          pip install pip-tools
          pip-compile --quiet --extra=dev --output-file=requirements.lock.next pyproject.toml
          diff -u requirements.lock requirements.lock.next

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -q -m "not integration and not device"

      - name: Golden incident eval corpus
        run: python -m app.eval --json

      - name: Scripted golden path CLI
        working-directory: ${{ github.workspace }}
        run: python scripts/golden_path.py

  api-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zeronode
          POSTGRES_PASSWORD: zeronode
          POSTGRES_DB: zeronode
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U zeronode -d zeronode"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/zeronode
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd="wget -qO- http://localhost:7474 || exit 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_DATABASE_URL: postgresql://zeronode:zeronode@localhost:5433/zeronode
      TEST_NEO4J_URI: bolt://localhost:7687
      TEST_NEO4J_USER: neo4j
      TEST_NEO4J_PASSWORD: zeronode
      STRICT_DEPENDENCIES: "true"
      FIREWALL_BACKEND: mock
      AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install API package
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .

      - name: Seed Neo4j graph
        working-directory: ${{ github.workspace }}
        run: python scripts/ci_seed_neo4j.py

      - name: Wait for Postgres
        working-directory: ${{ github.workspace }}
        run: python scripts/ci_wait_postgres.py

      - name: Integration tests
        run: pytest -q -m integration --strict-markers

  api-device:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      FAKE_ASA_HOST: 127.0.0.1
      FAKE_ASA_PORT: "2222"
      FAKE_ASA_USER: netops
      FAKE_ASA_PASSWORD: zeronode
      REQUIRE_DEVICE_EMULATOR: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install API package with device extras
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install "netmiko>=4.4.0"

      - name: Start fake-asa emulator
        working-directory: ${{ github.workspace }}
        run: docker compose --profile lab up -d --build fake-asa

      - name: Wait for fake-asa emulator
        working-directory: ${{ github.workspace }}
        run: python scripts/ci_wait_fake_asa.py

      - name: Device integration tests
        run: pytest -q -m device --strict-markers

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build

  docker-scan:
    runs-on: ubuntu-latest
    needs: [api, api-integration, api-device, web]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t zeronode-api:ci .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t zeronode-web:ci ./apps/web

      - name: Scan API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: zeronode-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan web image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: zeronode-web:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
