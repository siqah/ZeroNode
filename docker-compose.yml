services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/zeronode
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: zeronode
      POSTGRES_PASSWORD: zeronode
      POSTGRES_DB: zeronode
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeronode -d zeronode"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j-init:
    image: neo4j:5.26-community
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./infra/neo4j:/cypher:ro
    entrypoint: ["bash", "-c"]
    command:
      - |
        cypher-shell -a bolt://neo4j:7687 -u neo4j -p zeronode "MATCH (n) DETACH DELETE n"
        cypher-shell -a bolt://neo4j:7687 -u neo4j -p zeronode --file /cypher/schema.cypher
        cypher-shell -a bolt://neo4j:7687 -u neo4j -p zeronode --file /cypher/seed.cypher
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: zeronode
      DATABASE_URL: postgresql://zeronode:zeronode@postgres:5432/zeronode
      # Deliberately not ${OLLAMA_BASE_URL}: the host .env points at 127.0.0.1,
      # which inside the container resolves to the container itself.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-640}
      INFERENCE_BACKEND: ${INFERENCE_BACKEND:-ollama}
      NETBOX_URL: ${NETBOX_URL:-}
      NETBOX_TOKEN: ${NETBOX_TOKEN:-}
      TOPOLOGY_SITE: ${TOPOLOGY_SITE:-}
      TOPOLOGY_INGEST_INTERVAL_SECONDS: ${TOPOLOGY_INGEST_INTERVAL_SECONDS:-3600}
      TOPOLOGY_STALE_SECONDS: ${TOPOLOGY_STALE_SECONDS:-86400}
      TOPOLOGY_REPLACE_ON_INGEST: ${TOPOLOGY_REPLACE_ON_INGEST:-true}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-EMPTY}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      LOGIN_LOCK_THRESHOLD: ${LOGIN_LOCK_THRESHOLD:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      MFA_REQUIRED_FOR_APPROVERS: ${MFA_REQUIRED_FOR_APPROVERS:-true}
      AUDIT_SIGNING_KEY: ${AUDIT_SIGNING_KEY:-}
      AUDIT_RETIRED_KEYS: ${AUDIT_RETIRED_KEYS:-}
      # Anchors live on their own volume: an anchor written to the database it
      # is meant to police would prove nothing.
      AUDIT_ANCHOR_FILE: ${AUDIT_ANCHOR_FILE:-/var/lib/zeronode/anchors.jsonl}
      EXECUTION_ENABLED: ${EXECUTION_ENABLED:-false}
      EXECUTION_DEVICES: ${EXECUTION_DEVICES:-}
      EXECUTION_AUTO_ROLLBACK: ${EXECUTION_AUTO_ROLLBACK:-true}
      TICKET_WEBHOOK_URL: ${TICKET_WEBHOOK_URL:-}
      TICKET_WEBHOOK_TOKEN: ${TICKET_WEBHOOK_TOKEN:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_TOKEN: ${NOTIFY_WEBHOOK_TOKEN:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
      CHANGE_WINDOWS: ${CHANGE_WINDOWS:-}
      CHANGE_FREEZES: ${CHANGE_FREEZES:-}
      CHANGE_WINDOW_TZ: ${CHANGE_WINDOW_TZ:-UTC}
      SECRET_CACHE_SECONDS: ${SECRET_CACHE_SECONDS:-300}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      REQUIRE_MANAGED_SECRETS: ${REQUIRE_MANAGED_SECRETS:-true}
      # Compose brings the stores up first, so a failure here is a real failure.
      STRICT_DEPENDENCIES: ${STRICT_DEPENDENCIES:-true}
      FIREWALL_BACKEND: ${FIREWALL_BACKEND:-mock}
      FIREWALL_HOST: ${FIREWALL_HOST:-}
      FIREWALL_USERNAME: ${FIREWALL_USERNAME:-}
      FIREWALL_PASSWORD: ${FIREWALL_PASSWORD:-}
      FIREWALL_SECRET: ${FIREWALL_SECRET:-}
      FIREWALL_ACL: ${FIREWALL_ACL:-}
      FIREWALL_DEVICE_ID: ${FIREWALL_DEVICE_ID:-FW_Edge}
      FIREWALL_PORT: ${FIREWALL_PORT:-22}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-60}
      JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:-15}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-5}
      JOB_QUEUE_CAPACITY: ${JOB_QUEUE_CAPACITY:-100}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-90}
      MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-2}
      MODEL_CIRCUIT_FAILURES: ${MODEL_CIRCUIT_FAILURES:-5}
      MODEL_CIRCUIT_RESET_SECONDS: ${MODEL_CIRCUIT_RESET_SECONDS:-60}
      MODEL_INCIDENT_BUDGET_SECONDS: ${MODEL_INCIDENT_BUDGET_SECONDS:-480}
      MODEL_NODE_BUDGET_SECONDS: ${MODEL_NODE_BUDGET_SECONDS:-120}
      MODEL_ALLOW_INFERENCE_FALLBACK: ${MODEL_ALLOW_INFERENCE_FALLBACK:-false}
      MODEL_FALLBACK_DEGRADES_HEALTH: ${MODEL_FALLBACK_DEGRADES_HEALTH:-true}
      LOG_JSON: ${LOG_JSON:-false}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-zeronode-api}
    volumes:
      - audit_anchors:/var/lib/zeronode
    # /health fails while any store is degraded, so a container running on
    # in-memory fixtures does not look healthy to anything watching.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request as r; r.urlopen('http://localhost:8000/health')\""
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "app.jobs.worker"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: zeronode
      DATABASE_URL: postgresql://zeronode:zeronode@postgres:5432/zeronode
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-640}
      INFERENCE_BACKEND: ${INFERENCE_BACKEND:-ollama}
      NETBOX_URL: ${NETBOX_URL:-}
      NETBOX_TOKEN: ${NETBOX_TOKEN:-}
      TOPOLOGY_SITE: ${TOPOLOGY_SITE:-}
      TOPOLOGY_INGEST_INTERVAL_SECONDS: ${TOPOLOGY_INGEST_INTERVAL_SECONDS:-3600}
      TOPOLOGY_STALE_SECONDS: ${TOPOLOGY_STALE_SECONDS:-86400}
      TOPOLOGY_REPLACE_ON_INGEST: ${TOPOLOGY_REPLACE_ON_INGEST:-true}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-EMPTY}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-}
      AUDIT_SIGNING_KEY: ${AUDIT_SIGNING_KEY:-}
      AUDIT_RETIRED_KEYS: ${AUDIT_RETIRED_KEYS:-}
      AUDIT_ANCHOR_FILE: ${AUDIT_ANCHOR_FILE:-/var/lib/zeronode/anchors.jsonl}
      EXECUTION_ENABLED: ${EXECUTION_ENABLED:-false}
      EXECUTION_DEVICES: ${EXECUTION_DEVICES:-}
      EXECUTION_AUTO_ROLLBACK: ${EXECUTION_AUTO_ROLLBACK:-true}
      TICKET_WEBHOOK_URL: ${TICKET_WEBHOOK_URL:-}
      TICKET_WEBHOOK_TOKEN: ${TICKET_WEBHOOK_TOKEN:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_TOKEN: ${NOTIFY_WEBHOOK_TOKEN:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
      CHANGE_WINDOWS: ${CHANGE_WINDOWS:-}
      CHANGE_FREEZES: ${CHANGE_FREEZES:-}
      CHANGE_WINDOW_TZ: ${CHANGE_WINDOW_TZ:-UTC}
      REQUIRE_MANAGED_SECRETS: ${REQUIRE_MANAGED_SECRETS:-true}
      STRICT_DEPENDENCIES: ${STRICT_DEPENDENCIES:-true}
      FIREWALL_BACKEND: ${FIREWALL_BACKEND:-mock}
      FIREWALL_HOST: ${FIREWALL_HOST:-}
      FIREWALL_USERNAME: ${FIREWALL_USERNAME:-}
      FIREWALL_PASSWORD: ${FIREWALL_PASSWORD:-}
      FIREWALL_SECRET: ${FIREWALL_SECRET:-}
      FIREWALL_ACL: ${FIREWALL_ACL:-}
      FIREWALL_DEVICE_ID: ${FIREWALL_DEVICE_ID:-FW_Edge}
      FIREWALL_PORT: ${FIREWALL_PORT:-22}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-60}
      JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:-15}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-5}
      JOB_QUEUE_CAPACITY: ${JOB_QUEUE_CAPACITY:-100}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-90}
      MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-2}
      MODEL_CIRCUIT_FAILURES: ${MODEL_CIRCUIT_FAILURES:-5}
      MODEL_CIRCUIT_RESET_SECONDS: ${MODEL_CIRCUIT_RESET_SECONDS:-60}
      MODEL_INCIDENT_BUDGET_SECONDS: ${MODEL_INCIDENT_BUDGET_SECONDS:-480}
      MODEL_NODE_BUDGET_SECONDS: ${MODEL_NODE_BUDGET_SECONDS:-120}
      MODEL_ALLOW_INFERENCE_FALLBACK: ${MODEL_ALLOW_INFERENCE_FALLBACK:-false}
      MODEL_FALLBACK_DEGRADES_HEALTH: ${MODEL_FALLBACK_DEGRADES_HEALTH:-true}
      LOG_JSON: ${LOG_JSON:-true}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-zeronode-worker}
    volumes:
      - audit_anchors:/var/lib/zeronode
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

  # NetBox as a source of truth, so the graph comes from an inventory rather
  # than a seed written to fit the queries. Heavy: expect ~3 GB of images.
  #   docker compose --profile netbox up -d
  #   python scripts/ingest_netbox.py --token <api-token> --replace
  netbox-postgres:
    image: postgres:16
    container_name: zeronode-netbox-db
    profiles: ["netbox"]
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: netbox
    volumes:
      - netbox_db:/var/lib/postgresql/data

  netbox-redis:
    image: redis:7-alpine
    container_name: zeronode-netbox-redis
    profiles: ["netbox"]

  netbox:
    image: netboxcommunity/netbox:v4.1-3.0.2
    container_name: zeronode-netbox
    profiles: ["netbox"]
    depends_on: [netbox-postgres, netbox-redis]
    environment:
      DB_HOST: netbox-postgres
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: netbox
      REDIS_HOST: netbox-redis
      REDIS_DATABASE: "0"
      REDIS_CACHE_HOST: netbox-redis
      REDIS_CACHE_DATABASE: "1"
      SECRET_KEY: ${NETBOX_SECRET_KEY:-}
      SUPERUSER_NAME: ${NETBOX_USER:-admin}
      SUPERUSER_PASSWORD: ${NETBOX_PASSWORD:-}
      SUPERUSER_API_TOKEN: ${NETBOX_TOKEN:-}
      ALLOWED_HOSTS: "*"
    ports:
      - "8001:8080"
    volumes:
      - netbox_media:/opt/netbox/netbox/media

  # A device-shaped SSH server for testing the client against something that
  # changes when you configure it. Not in the default stack: start it with
  #   docker compose --profile lab up -d fake-asa
  fake-asa:
    build: ./infra/fakeasa
    container_name: zeronode-fake-asa
    profiles: ["lab"]
    ports:
      - "2222:2222"
    command: ["python", "server.py", "--port", "2222", "--username", "netops", "--password", "zeronode"]

volumes:
  neo4j_data:
  pg_data:
  audit_anchors:
  netbox_db:
  netbox_media:
