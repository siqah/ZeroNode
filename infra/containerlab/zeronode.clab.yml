# The cross-zone scenario as a real network.
#
#   web (DMZ, 10.10.1.10) --- fw (Nokia SR Linux) --- db (TRUST, 10.20.1.50)
#
# The firewall is the only node ZeroNode talks to; the hosts exist so that the
# flow the alert describes can actually be attempted and observed, rather than
# only reasoned about.
#
# SR Linux is a genuine NOS whose official container is public. The validation
# script pulls the pinned image, deploys this topology and removes it afterward.
#
# On macOS, containerlab needs a Linux host: run it inside a VM (OrbStack,
# Colima or Lima), or dockerised with --pid host on Docker Desktop. A Docker
# Desktop restart destroys the veth links, so redeploy with --reconfigure
# rather than restarting the containers.

name: zeronode

topology:
  nodes:
    fw:
      kind: nokia_srlinux
      type: ixr-d3
      image: ${SRL_IMAGE:=ghcr.io/nokia/srlinux:24.10.4}
      startup-config: fw.cli
      mgmt-ipv4: 172.20.20.11
      # Docker Desktop does not route the management subnet to macOS.
      ports:
        - 2223:22

    web:
      kind: linux
      image: alpine:3.20
      exec:
        - ip addr add 10.10.1.10/24 dev eth1
        - ip link set eth1 up
        - ip route add 10.20.1.0/24 via 10.10.1.1

    db:
      kind: linux
      image: python:3.12-alpine
      exec:
        - ip addr add 10.20.1.50/24 dev eth1
        - ip link set eth1 up
        - ip route add 10.10.1.0/24 via 10.20.1.1
        - sh -c 'mkdir -p /www; echo ok > /www/index.html; python -m http.server 443 --directory /www >/tmp/httpd.log 2>&1 &'

  links:
    - endpoints: ["web:eth1", "fw:e1-1"]
    - endpoints: ["db:eth1", "fw:e1-2"]
