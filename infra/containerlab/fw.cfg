! Startup configuration for the lab firewall.
!
! The ACL deliberately reproduces the seeded scenario: HTTPS from the DMZ host
! to the database is denied by a rule that a naive permit, appended at the end,
! would not get past. That shadowing is the thing worth testing against a real
! device, because it is invisible in a change ticket.
!
hostname fw
!
username netops privilege 15 secret zeronode
!
management api http-commands
   no shutdown
!
ip access-list DMZ_TO_TRUST
   10 permit tcp 10.10.1.0/24 10.20.1.0/24 eq www
   20 permit tcp host 10.10.1.20 host 10.20.1.50 eq 1521
   40 deny tcp 10.10.1.0/24 host 10.20.1.50 eq https
   50 deny ip any any
!
interface Ethernet1
   description to web (DMZ)
   no switchport
   ip address 10.10.1.1/24
   ip access-group DMZ_TO_TRUST in
!
interface Ethernet2
   description to db (TRUST)
   no switchport
   ip address 10.20.1.1/24
!
ip routing
!
end
